[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "chainbench"
version = "0.1.0"
description = "Reproducible numerical checks for classic optimization and iterative-method results."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "chocoemong17" }]
keywords = [
  "optimization",
  "reproducibility",
  "numerical-analysis",
  "nesterov",
  "fista",
  "heavy-ball",
  "benchmark",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
chainbench = "chainbench.cli:main"

[project.urls]
Homepage = "https://github.com/chocoemong17/chainbench"
Repository = "https://github.com/chocoemong17/chainbench"
Issues = "https://github.com/chocoemong17/chainbench/issues"
Changelog = "https://github.com/chocoemong17/chainbench/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/chainbench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
