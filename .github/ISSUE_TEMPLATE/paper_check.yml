name: Propose a paper explanation or literature check
description: Start with a rough mechanism, example and scene sequence
title: "[paper] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Start with a rough sketch, before polished media. Follow docs/LESSON_PROPOSAL.md for the outline and a filled example."
  - type: input
    id: citation
    attributes:
      label: Public reference
      description: DOI, arXiv, publisher, or stable bibliographic URL.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Mechanism or result to explain
      description: State the audience, one central idea, and the published quantitative or qualitative prediction.
    validations:
      required: true
  - type: textarea
    id: instance
    attributes:
      label: Deterministic test instance
      description: Explain how the reference value or optimum can be verified independently.
    validations:
      required: true
  - type: textarea
    id: scenes
    attributes:
      label: Rough scenes and interactions
      description: What moves, what can the reader change, and what should they notice? State the limits of this example.
