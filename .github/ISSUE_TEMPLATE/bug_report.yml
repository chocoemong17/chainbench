name: Bug report
description: Report incorrect behavior or a reproducibility problem
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the command, observed output, and expected behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, ChainBench version/commit, and operating system.
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Relevant public reference
      description: If the bug concerns a paper-specific check, provide the public source.
