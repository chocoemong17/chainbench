name: frozen release review

on:
  pull_request:
    paths: ['review/**', 'tests/test_review_kit.py', '.github/workflows/review.yml']
  push:
    branches: [main]
    paths: ['review/**', 'tests/test_review_kit.py', '.github/workflows/review.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  released-wheel:
    name: released v0.2.0 (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.12'}
          - {os: windows-latest, python: '3.12'}
          - {os: macos-latest, python: '3.12'}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Download the fixed public release, not a candidate build
        run: |
          python -c "import urllib.request; urllib.request.urlretrieve('https://github.com/chocoemong17/chainbench/releases/download/v0.2.0/chainbench-0.2.0-py3-none-any.whl', 'chainbench-0.2.0-py3-none-any.whl')"
          python review/review.py verify-wheel chainbench-0.2.0-py3-none-any.whl
      - run: python -m pip install ./chainbench-0.2.0-py3-none-any.whl
      - run: python -m pip check
      - name: Collect two independently invoked local runs
        run: |
          mkdir review-output
          python review/review.py collect --output review-output/first.json
          python review/review.py collect --output review-output/second.json
          python review/review.py compare review-output/first.json review-output/second.json > review-output/repeat-comparison.json
          python review/review.py summary review-output/first.json > review-output/summary.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frozen-release-review-${{ matrix.os }}-${{ github.run_id }}
          path: review-output/
          if-no-files-found: warn
          retention-days: 3

  compare-platforms:
    name: compare actual released-wheel reports across OSes
    needs: released-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: frozen-release-review-*-${{ github.run_id }}
          path: reports
      - name: Compare without executing report contents
        shell: bash
        run: |
          mkdir comparisons
          failed=0
          for os in windows-latest macos-latest; do
            status=0
            python review/review.py compare \
              "reports/frozen-release-review-ubuntu-latest-${{ github.run_id }}/first.json" \
              "reports/frozen-release-review-$os-${{ github.run_id }}/first.json" \
              > "comparisons/$os.json" || status=$?
            cat "comparisons/$os.json"
            # 3 is numerically close with different input bytes, NOT a bitwise match.
            # Structural/numeric differences (1) and invalid evidence (2) fail.
            if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then failed=1; fi
          done
          test "$failed" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frozen-release-comparisons-${{ github.run_id }}
          path: comparisons/
          if-no-files-found: warn
          retention-days: 3
