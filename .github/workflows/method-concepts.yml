name: Method concept review
on:
  push:
    branches: [study/method-concepts]
    paths:
      - scripts/render_method_concepts.py
      - scripts/render_method_explanations.py
      - scripts/render_method_intuition.py
      - .github/workflows/method-concepts.yml
permissions:
  contents: read
concurrency:
  group: method-concepts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rough-boards:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - run: sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
      - name: Check arithmetic and render rough storyboards only
        run: python scripts/render_method_intuition.py --output concept-review --source "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: method-concepts-${{ github.sha }}
          path: concept-review/
          retention-days: 7
          if-no-files-found: error
