name: Paper films review
on:
  push:
    branches: [feat/attention-resnet-films, feat/attention-resnet-explanations]
permissions:
  contents: read
concurrency:
  group: paper-films-${{ github.ref }}
  cancel-in-progress: true
jobs:
  films:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]' 'playwright==1.63.0' 'matplotlib==3.11.1' 'Pillow==11.3.0'
      - run: ruff check .
      - run: python -m pytest tests/test_visual_papers.py
      - run: python -m playwright install --with-deps chromium webkit
      - run: sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core ffmpeg
      - name: Build the three-film collection from this source
        run: |
          python - <<'PY'
          import shutil
          shutil.copytree('web', 'lesson-site')
          PY
          python scripts/render_adam_film.py --output lesson-site/papers/adam --source "$GITHUB_SHA"
          python scripts/render_visual_papers.py --output lesson-site/papers --review paper-preview --source "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: paper-preview-${{ github.sha }}
          path: paper-preview/
          retention-days: 7
          if-no-files-found: warn
      - run: python scripts/check_visual_papers_browser.py --site lesson-site --output paper-review
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: paper-review-${{ github.sha }}
          path: paper-review/
          retention-days: 7
          if-no-files-found: warn
