name: Diagnose comparison anchor
on:
  push:
    branches: [diagnose/classroom-anchors]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f1f0ec578314e381d7965cd101499233165d2b37
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install . 'playwright==1.63.0' 'pymupdf==1.28.2'
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Add failure diagnostics without changing the assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/check_comparison_browser.py')
          s = p.read_text()
          needle = "                expect(page.locator('#record-A')).to_be_in_viewport()"
          lines = [
              "                print('ANCHOR CASE', width, name, page.url, flush=True)",
              "                try:",
              "                    expect(page.locator('#record-A')).to_be_in_viewport()",
              "                except AssertionError:",
              "                    diagnostic = page.evaluate('''() => ({url:location.href, scrollY, active:document.activeElement.outerHTML, target:document.querySelector('#record-A').getBoundingClientRect().toJSON(), link:document.querySelector('nav a[href=\"#record-A\"]').getBoundingClientRect().toJSON(), rootScroll:document.documentElement.scrollTop, bodyScroll:document.body.scrollTop})''')",
              "                    print('ANCHOR FAILURE', json.dumps(diagnostic), flush=True)",
              "                    (args.output/'anchor-failure.json').write_text(json.dumps(diagnostic, indent=2))",
              "                    page.screenshot(path=str(args.output/'anchor-failure.png'))",
              "                    raise",
          ]
          assert s.count(needle) == 1
          p.write_text(s.replace(needle, '\n'.join(lines)))
          PY
      - name: Three independent diagnostic attempts
        run: |
          python - <<'PY'
          import subprocess, sys
          failures = []
          for i in range(1, 4):
              result = subprocess.run([sys.executable, 'scripts/check_comparison_browser.py', '--output', f'anchor-diagnosis/attempt-{i}'])
              print('DIAGNOSTIC ATTEMPT', i, 'EXIT', result.returncode, flush=True)
              failures.append(result.returncode)
          sys.exit(int(any(failures)))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: anchor-diagnosis
          path: anchor-diagnosis/
          retention-days: 3
