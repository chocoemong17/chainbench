name: Read classroom review evidence
on:
  push:
    branches: [diagnose/classroom-anchors]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the exact successful PR review artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37203567652 --repo chocoemong17/chainbench --name website-review-bc532d13d054efd880ec4e29d9e73fbdbb1a0608 --dir review
      - name: Emit only the eight classroom screenshots and browser proof
        run: |
          python - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          root = Path('review')
          proof = json.loads((root/'papers/verification.json').read_text())
          assert proof['source'] == 'bc532d13d054efd880ec4e29d9e73fbdbb1a0608'
          assert not proof['errors'] and not proof['external_requests']
          print('CLASSROOM_PROOF ' + json.dumps(proof), flush=True)
          total = 0
          for slug in ('attention','resnet'):
              for width in (1440,390):
                  for lang in ('en','ko'):
                      name = f'{slug}-chromium-{width}-{lang}-practice.png'
                      data = (root/'papers'/name).read_bytes()
                      total += len(data)
                      assert total < 8_000_000
                      encoded = base64.b64encode(data).decode()
                      print('CLASSROOM_IMAGE ' + json.dumps({'name':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}), flush=True)
                      for i in range(0,len(encoded),24000):
                          print('CLASSROOM_CHUNK ' + json.dumps({'name':name,'offset':i,'data':encoded[i:i+24000]}), flush=True)
          PY
