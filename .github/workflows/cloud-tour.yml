name: cloud reading bundle

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-tour-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reading-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Generate every report on the runner
        run: python -m chainbench tour --extended --lang ko --output reading-bundle
      - name: Independently audit hashes, links and all numerical records
        run: |
          PYTHONPATH=scripts python -c "from pathlib import Path; from smoke_workflows import validate_tour; r=validate_tour(Path('reading-bundle')); assert len(r)==24; print('24 numerical records independently validated')"
      - name: Record the source revision and environment
        run: |
          git rev-parse HEAD > reading-bundle/source-commit.txt
          python -m pip freeze > reading-bundle/environment.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chainbench-reading-bundle-${{ github.sha }}
          path: reading-bundle/
          if-no-files-found: error
          retention-days: 7
