name: cloud reading bundle

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reading-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install . 'playwright==1.63.0' 'pymupdf==1.28.2'
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Generate every report on the runner
        run: python -m chainbench tour --extended --lang ko --output reading-bundle
      - name: Audit every record and render the two-page review packet
        run: |
          python scripts/render_review_packet.py --tour reading-bundle --output review-packet --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Record the source revision and environment
        run: |
          git rev-parse HEAD > review-packet/source-commit.txt
          python -m pip freeze > review-packet/environment.txt
      - name: Package and verify the versioned reading assets
        run: |
          python scripts/reading_release.py prepare --tour reading-bundle --review review-packet --output reading-release --source "$GITHUB_SHA"
          python scripts/reading_release.py extract --directory reading-release --output extracted-reading --source "$GITHUB_SHA"
      - name: Read the extracted ZIP offline on desktop and mobile
        run: python scripts/check_tour_browser.py --tour extracted-reading --output extracted-browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chainbench-reading-release-${{ github.sha }}
          path: reading-release/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chainbench-reading-bundle-${{ github.sha }}
          path: reading-bundle/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chainbench-review-packet-${{ github.sha }}
          path: review-packet/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chainbench-extracted-browser-${{ github.sha }}
          path: extracted-browser/
          if-no-files-found: error
          retention-days: 7
