name: Adam design study
on:
  push:
    branches: [design/adam-film, feat/adam-depth]
    paths:
      - src/chainbench/adam_lesson.py
      - web/papers/adam/**
      - tests/test_adam_lesson.py
      - scripts/render_adam_film.py
      - scripts/check_adam_lesson_browser.py
      - .github/workflows/adam-design.yml
permissions:
  contents: read
jobs:
  lesson:
    name: Focused Adam film and browser review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]' 'playwright==1.63.0' 'matplotlib==3.11.1' 'Pillow==11.3.0'
      - run: ruff check .
      - run: python -m pytest tests/test_adam_lesson.py tests/test_adam_examples.py
      - name: Render static depth review before encoding the film
        run: python scripts/render_adam_film.py --preview-only --output preview-film --review depth-review --source "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: adam-depth-preview-${{ github.sha }}
          path: depth-review/
          if-no-files-found: warn
          retention-days: 7
      - run: python -m playwright install --with-deps chromium webkit
      - run: sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core ffmpeg
      - name: Build only the lesson for rapid visual feedback
        run: |
          python - <<'PY'
          import shutil
          shutil.copytree('web/papers/adam', 'lesson-site/papers/adam')
          PY
          python scripts/render_adam_film.py --output lesson-site/papers/adam --source "$GITHUB_SHA"
      - run: python scripts/check_adam_lesson_browser.py --site lesson-site --output adam-review
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: adam-focused-review-${{ github.sha }}
          path: adam-review/
          if-no-files-found: warn
          retention-days: 7
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect the declared difficult example
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import runpy
          trajectory=runpy.run_path('src/chainbench/adam_lesson.py')['trajectory']
          for method in ('gd','momentum','adam'):
              r=trajectory(method)
              print(method, r['settings'])
              for k in (0,1,10,60,66,100,611,1200):
                  print(r['rows'][k])
          PY
