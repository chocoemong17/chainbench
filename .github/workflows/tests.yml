name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.dependencies }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10', dependencies: current}
          - {os: ubuntu-latest, python: '3.11', dependencies: current}
          - {os: ubuntu-latest, python: '3.12', dependencies: current}
          - {os: windows-latest, python: '3.12', dependencies: current}
          - {os: macos-latest, python: '3.12', dependencies: current}
          - {os: ubuntu-latest, python: '3.10', dependencies: minimum}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - if: matrix.dependencies == 'minimum'
        run: python -m pip install 'numpy==1.24.0' 'pytest==8.0.0' 'ruff==0.6.0'
      - run: python -m pip check
      - run: ruff check .
      - run: python -m pytest
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && matrix.dependencies == 'current'
        run: python scripts/check_mutations.py
      - run: python examples/compare_quadratic.py --dim 6 --steps 8
      - run: chainbench check all --json
      - run: python -m chainbench --version

  package:
    name: wheel and sdist clean installation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m build
      - run: python -m pip freeze > dist/build-environment.txt
      - run: python scripts/smoke_install.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  reproduction-browser:
    name: offline reproduction browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install . 'playwright==1.63.0'
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: python -m chainbench reproduce shewchuk-1994 --lang ko --output paper.html
      - run: python scripts/check_reproduction_browser.py --html paper.html --output browser-check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reproduction-browser-${{ github.run_id }}
          path: browser-check/
          if-no-files-found: warn
          retention-days: 3
