name: release

on:
  push:
    branches: [main]
    paths:
      - release-manifest.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  publish:
    name: publish verified alpha release
    needs: verify
    if: github.repository == 'chocoemong17/chainbench' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m build
      - run: python -m pip freeze > dist/build-environment.txt
      - run: python scripts/smoke_install.py
      - name: Upload, verify and publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
