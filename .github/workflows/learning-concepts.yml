name: Learning foundations concept review
on:
  push:
    branches: [study/learning-foundations]
    paths:
      - review/learning_foundations.py
      - review/learning_foundations_v2.py
      - review/learning_foundations_v3.py
      - scripts/render_learning_concepts.py
      - scripts/render_learning_concepts_v2.py
      - scripts/render_learning_concepts_v3.py
      - scripts/publish_learning_review.py
      - .github/workflows/learning-concepts.yml
permissions:
  contents: read
concurrency:
  group: learning-concepts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  concepts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0' 'ruff==0.11.13'
      - run: ruff check review/learning_foundations*.py scripts/render_learning_concepts*.py scripts/publish_learning_review.py
      - run: sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
      - name: Verify arithmetic, render and decode all EN and KO scenes
        run: python scripts/render_learning_concepts_v3.py --output learning-review --source "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: learning-concepts-${{ github.sha }}
          path: learning-review/
          retention-days: 7
          if-no-files-found: error
      - name: Publish checked images to the review branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_learning_review.py
