name: diagnose Frank-Wolfe segment identities
on:
  push:
    branches: [diagnose/fw-segments]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            numpy: '1.24.0'
          - python: '3.12'
            numpy: '2.5.3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . 'numpy==${{ matrix.numpy }}'
      - run: python scripts/diagnose_fw_segments.py
