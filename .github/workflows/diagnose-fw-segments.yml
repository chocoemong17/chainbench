name: diagnose Frank-Wolfe segment identities
on:
  push:
    branches: [diagnose/fw-segments]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        core: [Haswell, Sandybridge, Prescott]
    env:
      OPENBLAS_CORETYPE: ${{ matrix.core }}
      OPENBLAS_VERBOSE: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[dev]' 'numpy==1.24.0' 'pytest==8.0.0'
      - run: python scripts/diagnose_fw_segments.py --require-clean
      - run: python -m pytest tests/test_fw_segment.py tests/test_simplex_geometry.py -q
